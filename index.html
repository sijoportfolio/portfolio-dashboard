<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Dashboard</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sijo Portfolio">
<meta name="theme-color" content="#0B1F3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09080B; --surface:#121116; --surface-2:#17161C;
    --border:#232129; --border-soft:#1B1A20;
    --text:#F2EFE9; --text-dim:#A6A3AE; --text-faint:#7A7886;
    --gold:#C9A227; --gold-bright:#DFC15A; --gold-dim:#6B5A20;
    --blue:#4F8FE8; --green:#35C48C; --orange:#E2883D; --purple:#B98FE0;
    --teal:#2DBFAE; --rose:#D67AB1; --red:#E2596B; --gray:#5B6774;
    --serif:'Playfair Display', serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);padding:36px 16px 90px;min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;}
  .page-title{font-size:11px;letter-spacing:.12em;color:var(--text-faint);margin-bottom:4px;}
  .refresh-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;}
  .page-sub{font-size:10.5px;color:var(--text-faint);margin:0;}
  .refresh-btn{font-family:var(--mono);font-size:10px;color:var(--gold-bright);background:none;border:1px solid var(--border);
    border-radius:6px;padding:6px 12px;cursor:pointer;flex:none;}
  .refresh-btn:disabled{opacity:.5;cursor:default;}
  .loading, .error-box{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .error-box{color:var(--red);border:1px solid var(--red);border-radius:10px;background:rgba(226,89,106,.06);}
  .spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;
    animation:spin .8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .goal-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:22px 20px;margin-bottom:14px;position:relative;}
  .toggle-row{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:14px;}
  .toggle-switch{width:30px;height:16px;border-radius:9px;background:var(--border);position:relative;flex-shrink:0;transition:background .15s;}
  .toggle-switch.on{background:var(--blue);}
  .toggle-knob{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text);transition:left .15s;}
  .toggle-switch.on .toggle-knob{left:16px;}
  .toggle-lbl{font-size:10px;color:var(--text-faint);}
  .active-sort{border-color:var(--blue) !important;color:var(--blue) !important;}
  .privacy-btn{position:absolute;top:14px;right:16px;background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;font-size:9px;padding:4px 8px;cursor:pointer;font-family:var(--mono);}
  .privacy-btn:hover{border-color:var(--gold);}
  .goal-flex{display:flex;gap:18px;align-items:center;}
  .ring-wrap{position:relative;width:140px;height:140px;flex:none;}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .rc-eyebrow{font-size:8px;letter-spacing:.12em;color:var(--text-faint);}
  .rc-value{font-family:var(--serif);font-size:18px;font-weight:600;margin:4px 0 2px;}
  .rc-return{font-size:11px;font-weight:600;margin-bottom:2px;}
  .rc-return.up{color:var(--green);} .rc-return.down{color:var(--red);}
  .rc-pct{font-size:9px;color:var(--gold-bright);font-family:var(--serif);font-style:italic;}
  .goal-detail{flex:1;min-width:0;}
  .gd-row{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);padding:4px 0;border-bottom:1px solid var(--border-soft);}
  .gd-row:last-child{border-bottom:none;}
  .gd-row .k{color:var(--text-faint);}
  .gd-row .v{font-weight:500;}
  .gd-row .v.loss{color:var(--red);}
  .eta-strip{display:flex;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid var(--border);}
  .eta-block{text-align:center;flex:1;}
  .eta-eyebrow{font-size:7.5px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:3px;}
  .eta-value{font-family:var(--serif);font-size:16px;color:var(--text);}
  .eta-value.target{color:var(--gold-bright);}
  .pace-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:18px 20px 14px;margin-bottom:14px;}
  .pace-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:16px;}
  .track-wrap{position:relative;height:34px;margin-bottom:6px;}
  .track{position:absolute;top:14px;left:0;right:0;height:6px;background:var(--border);border-radius:3px;}
  .track-fill{position:absolute;top:0;left:0;height:6px;border-radius:3px;background:linear-gradient(90deg, var(--blue), #7BB3F5);}
  .milestone{position:absolute;top:12px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--border);transform:translateX(-50%);}
  .milestone.passed{border-color:var(--gold);background:var(--gold);}
  .milestone-flagpole{position:absolute;top:-8px;width:1.5px;height:20px;background:var(--border);transform:translateX(-50%);}
  .milestone-flagpole.passed{background:var(--text-dim);}
  .milestone-flag{position:absolute;top:-8px;width:11px;height:8px;transform:translateX(1px);
    clip-path:polygon(0 0,100% 25%,0 50%);opacity:.4;}
  .milestone-flag.passed{opacity:1;box-shadow:0 0 4px currentColor;}
  .milestone-label{position:absolute;top:24px;font-size:8px;color:var(--text-faint);transform:translateX(-50%);white-space:nowrap;}
  .runner-marker{position:absolute;top:-9px;width:22px;height:22px;border-radius:50%;background:var(--blue);border:3px solid var(--bg);
    box-shadow:0 0 0 2px var(--blue),0 0 10px rgba(79,143,232,.5);transform:translateX(-50%);display:flex;align-items:center;justify-content:center;}
  .runner-marker svg{width:12px;height:12px;color:#08131F;}
  .finish-flag{position:absolute;top:8px;right:-3px;width:9px;height:16px;
    background:repeating-conic-gradient(var(--text) 0 25%, var(--bg) 0 50%) 0 0/6px 6px;
    border-radius:1px;box-shadow:0 0 0 1px var(--border);}
  .celebrate-burst{position:absolute;top:50%;left:50%;width:4px;height:8px;border-radius:1px;
    opacity:0;animation:celebrate-pop 1.6s ease-out infinite;pointer-events:none;}
  @keyframes celebrate-pop{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(0deg);}
    10%{opacity:1;}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(220deg);}
  }
  .fullscreen-celebrate{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;}
  .fs-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, rgba(223,193,90,.35), transparent 60%);
    animation:fs-flash-fade 1s ease-out forwards;}
  @keyframes fs-flash-fade{0%{opacity:0;}15%{opacity:1;}100%{opacity:0;}}
  .fs-confetti{position:absolute;top:-20px;width:7px;height:13px;border-radius:1px;opacity:0;
    animation-name:fs-confetti-fall;animation-timing-function:ease-in;animation-fill-mode:forwards;}
  @keyframes fs-confetti-fall{
    0%{opacity:0;transform:translateY(0) rotate(0deg);}
    8%{opacity:1;}
    100%{opacity:0;transform:translateY(100vh) rotate(360deg);}
  }
  .capital-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .capital-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:12px;}
  .pool-detail{max-height:0;overflow:hidden;transition:max-height .2s ease;}
  .pool-detail.expanded{max-height:200px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);}
  .pool-detail-row{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);padding:3px 0;}
  .capital-pools{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pool-box{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;padding:12px;}
  .pool-label{font-size:9px;letter-spacing:.06em;color:var(--text-faint);margin-bottom:6px;}
  .pool-value{font-family:var(--serif);font-size:16px;font-weight:600;}
  .pool-value.neg{color:var(--red);}
  .pool-sub{font-size:9px;color:var(--text-faint);margin-top:4px;line-height:1.5;}
  .chart-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:16px 18px 12px;margin-bottom:14px;}
  .chart-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:2px;}
  .chart-sub{font-size:9px;color:var(--text-faint);margin-bottom:10px;}
  .chart-legend{display:flex;gap:14px;margin-top:6px;font-size:8.5px;color:var(--text-faint);flex-wrap:wrap;}
  .chart-legend span{display:inline-flex;align-items:center;gap:4px;}
  .chart-sw{width:11px;height:2px;display:inline-block;}
  .chart-tooltip{position:absolute;z-index:500;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:6px;
    padding:7px 10px;font-size:10px;font-family:var(--mono);pointer-events:none;opacity:0;transition:opacity .08s;white-space:nowrap;}
  .chart-tooltip .ct-date{color:var(--text-faint);font-size:9px;margin-bottom:4px;}
  .chart-tooltip .ct-row{display:flex;align-items:center;gap:5px;color:var(--text-dim);}
  .chart-tooltip .ct-sw{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .crumb{display:flex;align-items:center;gap:5px;font-size:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:3px 7px;color:var(--text-dim);}
  .crumb button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:11px;padding:0;}
  .crumb-arrow{color:var(--text-faint);font-size:10px;}
  .filter-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;padding:9px 13px;margin-bottom:14px;font-size:10.5px;color:var(--text-dim);}
  .filter-bar.active{border-color:var(--gold);}
  .filter-clear{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--gold-bright);background:none;border:none;cursor:pointer;}
  .filter-empty{color:var(--text-faint);}
  .region-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:11px;padding:16px 18px;margin-bottom:10px;}
  .region-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:12px;}
  .region-body{display:flex;align-items:center;gap:16px;}
  .region-ring{position:relative;width:104px;height:104px;flex:none;}
  .region-svg path{cursor:pointer;transition:opacity .15s ease, transform .15s ease;transform-origin:center;}
  .region-svg path.dim{opacity:.22;}
  .region-svg path.selected{transform:scale(1.04);stroke:var(--text);stroke-width:1.5;}
  .rl-row.selected .rl-val{font-weight:800;font-size:11.5px;color:var(--gold-bright);}
  .region-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;}
  .region-center .v{font-family:var(--serif);font-size:14px;font-weight:600;}
  .region-center .k{font-size:7.5px;color:var(--text-faint);}
  .region-legend{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
  .rl-row{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:10.5px;transition:opacity .15s ease;}
  .rl-row.dim{opacity:.35;}
  .rl-sw{width:8px;height:8px;border-radius:2px;flex:none;}
  .rl-label{flex:1;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rl-val{font-family:var(--mono);color:var(--text-faint);font-size:9.5px;}
  .donut-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  @media (max-width:460px){.donut-grid{grid-template-columns:1fr;}}
  .donut-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:14px;}
  .donut-title{font-size:9px;letter-spacing:.08em;color:var(--text-faint);margin-bottom:10px;}
  .donut-body{display:flex;align-items:center;gap:10px;}
  .donut-svg path{cursor:pointer;transition:opacity .15s ease, transform .15s ease;transform-origin:center;}
  .donut-svg path.dim{opacity:.22;}
  .donut-svg path.selected{transform:scale(1.045);stroke:var(--text);stroke-width:1.5;}
  .legend-row.selected .legend-val{font-weight:800;font-size:10.5px;color:var(--gold-bright);}
  .donut-center{position:relative;}
  .donut-center-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .donut-center-label .v{font-family:var(--serif);font-size:11px;font-weight:600;}
  .donut-center-label .k{font-size:6px;color:var(--text-faint);}
  .legend-list{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;}
  .legend-row{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:9.5px;transition:opacity .15s ease;}
  .legend-row.dim{opacity:.35;}
  .legend-sw{width:7px;height:7px;border-radius:2px;flex:none;}
  .legend-label{flex:1;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .legend-val{font-family:var(--mono);color:var(--text-faint);font-size:9px;}
  .section-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin:18px 0 10px;}
  .card{background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;margin-bottom:6px;overflow:hidden;}
  .card:hover{border-color:var(--border);}
  .card.expanded{border-color:var(--blue);}
  .row{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;}
  .left-col{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
  .ticker-line{display:flex;align-items:baseline;gap:6px;}
  .ticker{font-family:var(--mono);font-weight:600;font-size:13px;}
  .qty{font-family:var(--mono);font-size:10px;color:var(--text-faint);}
  .quality-num{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:0 4px;border-radius:3px;}
  .q-high{background:rgba(53,196,140,.12);color:var(--green);}
  .q-mid{background:rgba(226,136,61,.12);color:var(--orange);}
  .q-low{background:rgba(226,89,106,.12);color:var(--red);}
  .name{font-size:10px;color:var(--text-faint);}
  .right-col{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none;min-width:100px;}
  .mkt-value{font-family:var(--mono);font-size:13px;font-weight:600;}
  .mkt-value.estimated{color:var(--orange);}
  .local-value{font-family:var(--mono);font-size:9px;color:var(--text-faint);}
  .price-edit-row{display:flex;gap:8px;align-items:center;margin:10px 0 12px;flex-wrap:wrap;}
  .price-edit-input{font-family:var(--mono);font-size:10px;background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:6px;padding:6px 8px;width:130px;}
  .gain-lines{display:flex;flex-direction:column;align-items:flex-end;gap:1px;margin-top:2px;}
  .gain-line{display:flex;align-items:center;gap:4px;font-size:9px;}
  .gain-lbl{color:var(--text-faint);font-size:7.5px;}
  .change{font-family:var(--mono);}
  .change.up{color:var(--green);}
  .change.down{color:var(--red);}
  .change.flat{color:var(--text-faint);}
  .stale-badge{font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(226,89,106,.12);color:var(--red);margin-top:2px;}
  .chevron{color:var(--text-faint);font-size:9px;flex:none;transition:transform .15s ease;}
  .card.expanded .chevron{transform:rotate(180deg);}
  .panel{border-top:1px solid var(--border-soft);padding:12px 14px;display:none;background:var(--surface-2);}
  .card.expanded .panel{display:block;}
  .meta-line{font-size:9.5px;font-family:var(--mono);color:var(--text-faint);margin-bottom:10px;line-height:1.6;}
  .txn-history-label{font-size:9.5px;color:var(--text-faint);margin-top:8px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
  .lot-row{display:grid;grid-template-columns:1.1fr .7fr .9fr .8fr 1fr;gap:6px;padding:5px 0;border-bottom:1px solid var(--border-soft);
    font-family:var(--mono);font-size:9.5px;align-items:center;}
  .lot-row:last-child{border-bottom:none;}
  .lot-row.head{color:var(--text-faint);font-size:8px;text-transform:uppercase;font-weight:600;}
  .lot-gl{display:flex;align-items:center;gap:3px;justify-content:flex-end;}
  .lot-gl.up{color:var(--green);}
  .lot-gl.down{color:var(--red);}
  .lot-term{font-size:8px;padding:1px 4px;border-radius:3px;}
  .lot-term.ltcg{background:rgba(53,196,140,.1);color:var(--green);}
  .lot-term.stcg{background:rgba(226,136,61,.1);color:var(--orange);}
  .closed-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border-soft);
    border-radius:9px;padding:9px 14px;margin-bottom:6px;font-size:10px;color:var(--text-dim);}
  .closed-row b{font-family:var(--mono);color:var(--text);}
  .closed-filters{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .ticker-suggest{position:absolute;top:100%;left:0;z-index:50;min-width:100%;max-height:160px;overflow-y:auto;
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:6px;margin-top:2px;display:none;}
  .ticker-suggest.show{display:block;}
  .ticker-suggest-row{padding:6px 10px;font-size:11px;font-family:var(--mono);cursor:pointer;white-space:nowrap;}
  .ticker-suggest-row:hover{background:var(--surface);}
  .closed-card{margin-bottom:6px;}
  .closed-card .closed-row{margin-bottom:0;border-radius:9px 9px 0 0;}
  .closed-card:not(.expanded) .closed-row{border-radius:9px;}
  .closed-detail-panel{display:none;padding:8px 10px 4px;background:var(--surface-2);border:1px solid var(--border-soft);border-top:none;border-radius:0 0 9px 9px;}
  .closed-card.expanded .closed-detail-panel{display:block;}
  .closed-detail-panel.expanded{display:block;margin-top:6px;border-radius:9px;border-top:1px solid var(--border-soft);}
  .closed-section-card{margin-top:8px;}
  .closed-section-body{display:none;padding-top:10px;}
  .closed-section-card.expanded .closed-section-body{display:block;}
  .hint{font-size:10px;color:var(--text-faint);margin-top:18px;line-height:1.6;}

  /* ---- Add Transaction modal ---- */
  .fab-stack{position:fixed;bottom:24px;right:20px;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:800;}
  .fab-sub{width:46px;height:46px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--gold-bright);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.4);opacity:0;transform:translateY(10px) scale(.7);
    transition:opacity .18s ease, transform .18s ease;pointer-events:none;}
  .fab-stack.expanded .fab-sub{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .fab-main-wrap{position:relative;}
  .fab-main{width:56px;height:56px;border-radius:50%;background:var(--gold);color:#08131F;border:none;
    font-size:26px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;}
  .fab-chevron{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:20px;height:20px;
    border-radius:50%;background:var(--surface);border:1px solid var(--gold);color:var(--gold-bright);
    font-size:9px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
    animation:chevron-hint 2.2s ease-in-out infinite;}
  .fab-stack.expanded .fab-chevron{transform:translateX(-50%) rotate(180deg);animation:none;}
  @keyframes chevron-hint{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-3px);}}

  .tab-switcher{max-width:640px;margin:0 auto;padding:14px 16px 0;display:flex;gap:8px;}
  .tab-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--text-faint);background:none;
    border:1px solid var(--border);border-radius:7px;padding:8px 14px;cursor:pointer;}
  .tab-btn.active{color:var(--gold-bright);border-color:var(--gold);background:rgba(201,162,39,.08);}

  .alert-banner{position:fixed;top:16px;left:16px;right:16px;max-width:390px;margin:0 auto;z-index:950;
    background:var(--surface);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;
    box-shadow:0 8px 28px rgba(0,0,0,.5);display:flex;gap:12px;align-items:flex-start;
    transform:translateY(-140%);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.3), opacity .25s ease;
    pointer-events:none;}
  .alert-banner.show{transform:translateY(0);opacity:1;pointer-events:auto;}
  .alert-icon{width:32px;height:32px;border-radius:50%;background:rgba(201,162,39,.15);color:var(--gold-bright);
    flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .alert-body{flex:1;min-width:0;}
  .alert-title{font-size:11.5px;font-weight:600;color:var(--gold-bright);margin-bottom:2px;}
  .alert-text{font-size:10.5px;color:var(--text-dim);line-height:1.5;}
  .alert-close{background:none;border:none;color:var(--text-faint);font-size:16px;cursor:pointer;flex:none;}

  .wl-row{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--surface);
    border:1px solid var(--border-soft);border-radius:9px;margin-bottom:8px;}
  .wl-left{flex:1;min-width:0;}
  .wl-ticker{font-weight:600;font-size:13px;}
  .wl-meta{font-size:9.5px;color:var(--text-faint);margin-top:2px;}
  .wl-right{text-align:right;flex:none;}
  .wl-current{font-size:12px;font-weight:600;}
  .wl-distance{font-size:9.5px;margin-top:2px;}
  .wl-distance.close{color:var(--gold-bright);}
  .wl-distance.far{color:var(--text-faint);}
  .wl-badge{font-size:8px;padding:2px 6px;border-radius:3px;margin-top:4px;display:inline-block;}
  .wl-badge.active{background:rgba(79,143,232,.12);color:var(--blue);}
  .wl-badge.triggered{background:rgba(53,196,140,.15);color:var(--green);}
  .wl-dismiss{background:none;border:none;color:var(--text-faint);font-size:9px;cursor:pointer;margin-top:4px;text-decoration:underline;}
  .wl-dir-toggle{display:flex;gap:8px;}
  .wl-dir-btn{flex:1;font-family:var(--mono);font-size:10.5px;padding:9px;border-radius:7px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-faint);cursor:pointer;}
  .wl-dir-btn.selected{border-color:var(--gold);color:var(--gold-bright);background:rgba(201,162,39,.08);}
  .is-family .wl-dismiss, .is-family #fab-stack .fab-sub{display:none !important;}
  .txn-modal-overlay.show{display:flex;}
  .txn-modal{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px 16px 0 0;width:100%;max-width:480px;
    max-height:88vh;overflow-y:auto;padding:20px 18px 24px;}
  @media (min-width:520px){.txn-modal-overlay{align-items:center;} .txn-modal{border-radius:14px;max-height:80vh;}}
  .txn-modal-title{font-family:var(--serif);font-size:17px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}
  .txn-modal-close{background:none;border:none;color:var(--text-faint);font-size:20px;cursor:pointer;}
  .txn-field{margin-bottom:12px;}
  .txn-label{font-size:9.5px;color:var(--text-faint);letter-spacing:.05em;margin-bottom:4px;display:block;}
  .txn-input, .txn-select{width:100%;font-family:var(--mono);font-size:12px;background:var(--surface-2);color:var(--text);
    border:1px solid var(--border);border-radius:7px;padding:9px 10px;}
  .txn-input:focus, .txn-select:focus{border-color:var(--blue);outline:none;}
  .txn-asset-wrap{position:relative;}
  .txn-preview{font-size:10.5px;color:var(--text-dim);background:var(--surface-2);border-radius:7px;padding:8px 10px;margin-bottom:12px;}
  .txn-preview b{color:var(--gold-bright);}
  .txn-warning{font-size:10.5px;color:var(--orange);background:rgba(226,136,61,.1);border:1px solid rgba(226,136,61,.3);
    border-radius:7px;padding:8px 10px;margin-bottom:10px;line-height:1.5;}
  .txn-error{font-size:10.5px;color:var(--red);background:rgba(226,89,106,.1);border:1px solid rgba(226,89,106,.3);
    border-radius:7px;padding:8px 10px;margin-bottom:10px;}
  .txn-confirm-row{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text-dim);margin-bottom:12px;}
  .txn-submit-btn{width:100%;font-family:var(--mono);font-size:12px;font-weight:600;color:#08131F;background:var(--gold);
    border:none;border-radius:8px;padding:12px;cursor:pointer;}
  .txn-submit-btn:disabled{opacity:.5;cursor:default;}
  .txn-new-ticker-fields{border-top:1px solid var(--border-soft);margin-top:4px;padding-top:10px;}

  /* ---- Access key gate ---- */
  .lock-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;}
  .lock-screen.show{display:flex;}
  .lock-card{max-width:320px;width:100%;text-align:center;}
  .lock-title{font-family:var(--serif);font-size:20px;margin-bottom:6px;}
  .lock-sub{font-size:11px;color:var(--text-faint);margin-bottom:20px;line-height:1.6;}
  .lock-input{width:100%;font-family:var(--mono);font-size:16px;text-align:center;letter-spacing:.1em;background:var(--surface);
    color:var(--text);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;}
  .lock-input:focus{border-color:var(--gold);outline:none;}
  .lock-submit{width:100%;font-family:var(--mono);font-size:12px;font-weight:600;color:#08131F;background:var(--gold);
    border:none;border-radius:8px;padding:13px;cursor:pointer;}
  .lock-error{font-size:10.5px;color:var(--red);margin-top:10px;min-height:14px;}
  .is-family #refresh-btn, .is-family #fab-stack, .is-family .price-edit-row{display:none !important;}
</style>
</head>
<body>
<div class="lock-screen" id="lock-screen">
  <div class="lock-card">
    <div class="lock-title">Sijo Portfolio</div>
    <div class="lock-sub">Enter your access key to continue.</div>
    <input type="password" class="lock-input" id="lock-key-input" placeholder="Access key" autocomplete="off"
      onkeydown="if(event.key==='Enter') submitAccessKey()">
    <button class="lock-submit" onclick="submitAccessKey()">Unlock</button>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>
<div class="tab-switcher" id="tab-switcher" style="display:none;">
  <button class="tab-btn active" id="tab-btn-portfolio" onclick="switchTab('portfolio')">PORTFOLIO</button>
  <button class="tab-btn" id="tab-btn-watchlist" onclick="switchTab('watchlist')">WATCHLIST</button>
</div>
<div class="wrap" id="main-wrap" style="display:none;">
  <p class="page-title">PORTFOLIO OVERVIEW</p>
  <div class="refresh-row">
    <p class="page-sub" id="asof-line">Loading...</p>
    <button class="refresh-btn" id="refresh-btn" onclick="fullLoad(true)">Refresh prices</button>
  </div>
  <div id="app">
    <div class="loading"><div class="spinner"></div>Fetching live holdings...</div>
  </div>
  <div id="watchlist-view" style="display:none;"></div>
</div>
<div class="fab-stack" id="fab-stack">
  <div class="fab-sub" onclick="openWatchlistAddModal()" tabindex="0" title="Add to watchlist">👁</div>
  <div class="fab-main-wrap">
    <button class="fab-chevron" onclick="event.stopPropagation(); toggleFab();" title="More options">▲</button>
    <button class="fab-main" onclick="openTxnModal()">+</button>
  </div>
</div>
<div class="txn-modal-overlay" id="txn-modal-overlay" onclick="if(event.target===this) closeTxnModal()">
  <div class="txn-modal">
    <div class="txn-modal-title">Add Transaction<button class="txn-modal-close" onclick="closeTxnModal()">&times;</button></div>
    <div id="txn-modal-body"></div>
  </div>
</div>
<div class="txn-modal-overlay" id="wl-add-modal-overlay" onclick="if(event.target===this) closeWatchlistAddModal()">
  <div class="txn-modal">
    <div class="txn-modal-title">Add to Watchlist<button class="txn-modal-close" onclick="closeWatchlistAddModal()">&times;</button></div>
    <div id="wl-add-modal-body"></div>
  </div>
</div>
<div class="alert-banner" id="alert-banner">
  <div class="alert-icon">🎯</div>
  <div class="alert-body">
    <div class="alert-title" id="alert-title">Watchlist target hit</div>
    <div class="alert-text" id="alert-text"></div>
  </div>
  <button class="alert-close" onclick="hideAlertBanner()">&times;</button>
</div>
<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxXmRugzGUz47znt34cT4CR13ZtwOau8ZhFe8YO9KT3ittvuuWFWlh-4sHgZbnDlpqRTw/exec';
let HOLDINGS = [], ACCOUNTS = [], TARGETS = [], TRANSACTIONS = [], filterChain = [], valuesHidden = false;
let CONFIG = {};
let RETURNS = null;
// Master toggle for the totals ring + every pie + the holdings list beneath -
// default EXCLUDES cash and closed-position realized gains from headline
// figures, since that's the "what do I actually hold right now" view. Toggling
// on blends cash balances and historical realized P/L back in everywhere.
let excludeCashAndClosed = true;
let openSortBy = 'positionSize';
function tickerCompare(a,b){ return String(a.asset_id||'').localeCompare(String(b.asset_id||'')); }
// Shared by both open-positions and closed-positions sort dropdowns, so the two
// always offer identical options and behave identically for the same choice.
function sortComparator(sortBy){
  const capOrder = {Mega:0,Large:1,Medium:2,Small:3,Micro:4,NA:5};
  return function(a,b){
    switch(sortBy){
      case 'broker': { const ba=accountBroker(a.account_id), bb=accountBroker(b.account_id); return ba===bb ? tickerCompare(a,b) : ba.localeCompare(bb); }
      case 'currency': { return a.currency===b.currency ? tickerCompare(a,b) : String(a.currency||'').localeCompare(String(b.currency||'')); }
      case 'ticker': return tickerCompare(a,b);
      case 'assetType': { const at=String(a.classification||''), bt=String(b.classification||''); return at===bt ? tickerCompare(a,b) : at.localeCompare(bt); }
      case 'companySize': { const av=capOrder[a.market_cap_segment]!==undefined?capOrder[a.market_cap_segment]:9, bv=capOrder[b.market_cap_segment]!==undefined?capOrder[b.market_cap_segment]:9; return av===bv?tickerCompare(a,b):av-bv; }
      case 'date': { const ad=closedDateFor(a), bd=closedDateFor(b); return (bd?bd.getTime():0)-(ad?ad.getTime():0); }
      case 'positionSize': default: { const av=(a.market_value_estimated!==undefined?a.market_value_estimated:a.market_value_base)||0, bv=(b.market_value_estimated!==undefined?b.market_value_estimated:b.market_value_base)||0; return bv-av; }
    }
  };
}
function sortOptionsHtml(current){
  const opts = [['positionSize','Position size'],['broker','Broker'],['currency','Currency'],['ticker','Ticker'],['assetType','Asset type'],['companySize','Company size'],['date','Date']];
  return opts.map(function(o){ return '<option value="' + o[0] + '"' + (current===o[0]?' selected':'') + '>' + o[1] + '</option>'; }).join('');
}
function toggleExcludeCashClosed(){ excludeCashAndClosed = !excludeCashAndClosed; renderAll(); }
function setOpenSort(v){ openSortBy = v; renderTickerCards(); }
let FULLSCREEN_CELEBRATION_SHOWN = false;
function isoDateStr(d){ return d.toISOString().slice(0,10); }
function defaultClosedFilter(){
  const today = new Date();
  const monthAgo = new Date(today); monthAgo.setMonth(monthAgo.getMonth()-1);
  return {ticker:'', from: isoDateStr(monthAgo), to: isoDateStr(today), sortBy:'date', broker:''};
}
let closedFilter = defaultClosedFilter();
function setClosedRangePreset(preset){
  const today = new Date();
  if(preset==='ytd'){
    closedFilter.from = isoDateStr(new Date(today.getFullYear(),0,1)); closedFilter.to = isoDateStr(today);
  } else if(preset==='ly'){
    closedFilter.from = isoDateStr(new Date(today.getFullYear()-1,0,1)); closedFilter.to = isoDateStr(new Date(today.getFullYear()-1,11,31));
  } else if(preset==='inception'){
    const inceptionStr = CONFIG.portfolio_inception;
    closedFilter.from = inceptionStr ? String(inceptionStr).slice(0,10) : isoDateStr(new Date(today.getFullYear()-20,0,1));
    closedFilter.to = isoDateStr(today);
  }
  syncClosedFilterInputs();
  renderClosedResultsOnly();
}
function setClosedSort(by){ closedFilter.sortBy = by; renderClosedResultsOnly(); }
function toggleValues(){ valuesHidden = !valuesHidden; renderAll(); }
function maskable(str){ return valuesHidden ? '*****' : str; }
function accountBroker(accountId){ const a = ACCOUNTS.find(x => x.account_id === accountId); return a ? a.broker : accountId; }
function activeTarget(){
  const today = new Date();
  const sorted = TARGETS.slice().sort((a,b) => new Date(a.effective_date) - new Date(b.effective_date));
  let active = sorted[0];
  sorted.forEach(t => { if(new Date(t.effective_date) <= today) active = t; });
  return active;
}
function indianGroup(intDigits){
  if(intDigits.length <= 3) return intDigits;
  const lastThree = intDigits.slice(-3);
  const rest = intDigits.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  return rest + ',' + lastThree;
}
function fmtIndian(v, maxFrac){
  const neg = v < 0;
  const fixed = Math.abs(v).toFixed(maxFrac===undefined?2:maxFrac);
  const parts = fixed.split('.');
  return (neg?'-':'') + indianGroup(parts[0]) + (parts[1] && Number(parts[1])>0 ? '.' + parts[1] : '');
}
function fmtMoney(v, ccy){
  if(v === null || v === undefined) return '-';
  const sym = ccy === 'INR' ? 'Rs ' : ccy === 'AED' ? 'AED ' : ccy === 'USD' ? '$' : '';
  const numStr = ccy === 'INR' ? fmtIndian(v, 2) : Math.abs(v).toLocaleString(undefined, {maximumFractionDigits:2});
  return sym + numStr + (v<0 && ccy!=='INR' ? ' (neg)':'');
}
function fmtUsd(v){ if(v === null || v === undefined) return '-'; return '$' + v.toLocaleString(undefined, {maximumFractionDigits:0}); }

function renderGoalAndPace(){
  const target = activeTarget();
  const includeCash = !excludeCashAndClosed;
  const includeClosedGain = !excludeCashAndClosed;
  const nonCash = HOLDINGS.filter(h => !String(h.asset_id).startsWith('CASH-') && h.quantity > 0);
  const baseData = fullyFiltered(HOLDINGS.filter(h => includeCash || !String(h.asset_id).startsWith('CASH-')));
  const knownValue = baseData.reduce((s,h) => s + (h.market_value_estimated!==undefined ? (h.market_value_estimated||0) : (h.market_value_base||0)), 0);
  const totalGainBase = baseData.reduce((s,h) => s + (h.unrealized_gain_base||0) + (includeClosedGain ? (h.realized_gain_base||0) : 0), 0);
  const dayGainBase = baseData.reduce((s,h) => s + (h.day_gain_base||0), 0);
  const costBasisImplied = knownValue - totalGainBase;
  const totalGainPct = costBasisImplied > 0 ? (totalGainBase/costBasisImplied*100) : null;
  let xirrPct = null, twrPct = null, annualizedPct = null;
  if(RETURNS && RETURNS.periods && RETURNS.periods.ITD){
    xirrPct = RETURNS.periods.ITD.xirr!==null && RETURNS.periods.ITD.xirr!==undefined ? RETURNS.periods.ITD.xirr*100 : null;
    twrPct = RETURNS.periods.ITD.twr!==null && RETURNS.periods.ITD.twr!==undefined ? RETURNS.periods.ITD.twr*100 : null;
  }
  if(xirrPct===null && twrPct===null && totalGainPct!==null && CONFIG.portfolio_inception){
    const daysSinceInception = (new Date() - new Date(CONFIG.portfolio_inception)) / (1000*60*60*24);
    if(daysSinceInception > 30 && (1+totalGainPct/100) > 0){
      annualizedPct = (Math.pow(1+totalGainPct/100, 365.25/daysSinceInception) - 1) * 100;
    }
  }
  const estimatedPositions = nonCash.filter(h => h.is_estimated);
  const goalAmount = target ? Number(target.goal_amount_usd) : null;
  const targetDate = target ? target.target_date : null;
  const targetCagr = target ? Number(target.target_cagr) : null;
  const monthly = target ? Number(target.monthly_contribution_usd) : null;
  const pct = goalAmount ? (knownValue/goalAmount*100) : 0;
  const milestonePcts = [12.5, 25, 50, 100];

  document.getElementById('goal-section').innerHTML =
    '<div class="goal-card">' +
      '<button class="privacy-btn" onclick="toggleValues()">' + (valuesHidden?'show':'hide') + '</button>' +
      '<div class="toggle-row" onclick="toggleExcludeCashClosed()">' +
        '<div class="toggle-switch ' + (excludeCashAndClosed?'':'on') + '"><div class="toggle-knob"></div></div>' +
        '<span class="toggle-lbl">' + (excludeCashAndClosed ? 'Excluding cash + closed P/L - tap to include' : 'Including cash + closed P/L - tap to exclude') + '</span>' +
      '</div>' +
      '<div class="goal-flex">' +
        '<div class="ring-wrap"><svg width="140" height="140" viewBox="0 0 140 140" style="transform:rotate(-90deg)">' +
          '<circle cx="70" cy="70" r="60" fill="none" stroke="#1E1C24" stroke-width="7"/>' +
          '<circle cx="70" cy="70" r="60" fill="none" stroke="#4F8FE8" stroke-width="7" stroke-dasharray="' + (Math.min(pct,100)/100*2*Math.PI*60).toFixed(1) + ' 10000" stroke-linecap="round"/>' +
        '</svg><div class="ring-center"><div class="rc-eyebrow">' + (filterChain.length ? filterChain.map(f=>f.value).join(' + ') : 'PORTFOLIO') + '</div><div class="rc-value">' + maskable(fmtUsd(knownValue)) + '</div>' +
        (totalGainPct!==null ? '<div class="rc-return ' + (totalGainPct>=0?'up':'down') + '">' + (totalGainPct>=0?'+':'') + totalGainPct.toFixed(1) + '% all-time</div>' : '') +
        '<div class="rc-pct">' + (goalAmount ? pct.toFixed(1)+'% of '+maskable(fmtUsd(goalAmount)) : 'no active target') + '</div></div></div>' +
        '<div class="goal-detail"><div class="gd-row"><span class="k">Positions</span><span class="v">' + nonCash.length + '</span></div>' +
        '<div class="gd-row"><span class="k">At cost (no live price)</span><span class="v ' + (estimatedPositions.length?'loss':'') + '">' + estimatedPositions.length + '</span></div>' +
        '<div class="gd-row"><span class="k">Total Gain</span><span class="change ' + (totalGainBase>=0?'up':'down') + '">' + (totalGainBase>=0?'+':'-') + maskable(fmtUsd(Math.abs(totalGainBase))) + (totalGainPct!==null ? ' (' + (totalGainPct>=0?'+':'') + totalGainPct.toFixed(1) + '%)' : '') + '</span></div>' +
        (xirrPct!==null ? '<div class="gd-row"><span class="k">XIRR (since inception)</span><span class="change ' + (xirrPct>=0?'up':'down') + '">' + (xirrPct>=0?'+':'') + xirrPct.toFixed(1) + '%/yr</span></div>' : '') +
        (twrPct!==null ? '<div class="gd-row"><span class="k">TWR (since inception)</span><span class="change ' + (twrPct>=0?'up':'down') + '">' + (twrPct>=0?'+':'') + twrPct.toFixed(1) + '%/yr</span></div>' : '') +
        (annualizedPct!==null ? '<div class="gd-row"><span class="k">Annualized (approx.)</span><span class="change ' + (annualizedPct>=0?'up':'down') + '">' + (annualizedPct>=0?'+':'') + annualizedPct.toFixed(1) + '%/yr</span></div>' : '') +
        '<div class="gd-row"><span class="k">Today\'s Gain</span><span class="change ' + (dayGainBase>=0?'up':'down') + '">' + (dayGainBase>=0?'+':'-') + maskable(fmtUsd(Math.abs(dayGainBase))) + '</span></div></div>' +
      '</div>' +
      (target ?
        '<div class="eta-strip"><div class="eta-block"><div class="eta-eyebrow">TARGET DATE</div><div class="eta-value target">' + new Date(targetDate).getFullYear() + '</div></div>' +
        '<div class="eta-block"><div class="eta-eyebrow">TARGET CAGR</div><div class="eta-value">' + targetCagr + '%</div></div>' +
        '<div class="eta-block"><div class="eta-eyebrow">MONTHLY PLAN</div><div class="eta-value">' + maskable(fmtUsd(monthly)) + '</div></div></div>'
        : '<p class="hint" style="margin-top:12px;">No active row in <b>targets</b>.</p>') +
      (estimatedPositions.length ? '<p class="hint" style="margin-top:10px;">At-cost positions (' + estimatedPositions.map(function(p){return p.asset_id;}).join(', ') + ') use purchase price, not a live value.</p>' : '') +
    '</div>';

  function milestoneVisualPct(realPct){
    const stops = [{r:0,v:0},{r:12.5,v:25},{r:25,v:50},{r:50,v:75},{r:100,v:100}];
    const clamped = Math.max(0, Math.min(100, realPct));
    for(let i=0;i<stops.length-1;i++){
      const a=stops[i], b=stops[i+1];
      if(clamped>=a.r && clamped<=b.r){
        const frac = (b.r===a.r) ? 0 : (clamped-a.r)/(b.r-a.r);
        return a.v + frac*(b.v-a.v);
      }
    }
    return 100;
  }
  const visualPct = milestoneVisualPct(pct);
  const NEAR_MILESTONE_BAND_USD = 2000;
  const nearMilestone = goalAmount && milestonePcts.some(function(m){
    return Math.abs(knownValue - goalAmount*m/100) <= NEAR_MILESTONE_BAND_USD;
  });
  const burstColors = ['var(--gold-bright)','var(--blue)','var(--green)','var(--rose)'];
  const burstHtml = nearMilestone ? burstColors.map(function(c,i){
    const angle = (i/burstColors.length)*2*Math.PI + 0.4;
    const dx = Math.round(Math.cos(angle)*20), dy = Math.round(Math.sin(angle)*20-14);
    return '<div class="celebrate-burst" style="background:' + c + ';--dx:' + dx + 'px;--dy:' + dy + 'px;animation-delay:' + (i*0.12) + 's;"></div>';
  }).join('') : '';
  if(nearMilestone && !FULLSCREEN_CELEBRATION_SHOWN){
    FULLSCREEN_CELEBRATION_SHOWN = true;
    triggerFullscreenCelebration();
  }
  document.getElementById('pace-section').innerHTML =
    '<div class="pace-card"><div class="pace-title">PROGRESS TO GOAL - milestones at 12.5/25/50/100% of goal_amount_usd, evenly spaced for readability</div>' +
    '<div class="track-wrap"><div class="track"><div class="track-fill" style="width:' + visualPct + '%"></div></div>' +

function renderTrajectoryChart(currentValue, target){
  if(!target){ document.getElementById('trajectory-section').innerHTML=''; return; }
  const goalAmount = Number(target.goal_amount_usd);
  const plannedMonthly = Number(target.monthly_contribution_usd);
  const targetCagr = Number(target.target_cagr)/100;

  const startDate = new Date(target.effective_date);
  const today = new Date();
  const paceWindowMonths = 12;
  const paceWindowStart = new Date(today); paceWindowStart.setMonth(paceWindowStart.getMonth()-paceWindowMonths);
  const effectivePaceStart = paceWindowStart > startDate ? paceWindowStart : startDate;
  const paceMonthsElapsed = Math.max(1, (today-effectivePaceStart)/(1000*60*60*24*30));
  const recentContributed = TRANSACTIONS.filter(function(t){ return t.action==='BUY' && new Date(t.date) >= effectivePaceStart && t.base_currency_amount; })
    .reduce(function(s,t){ return s+Number(t.base_currency_amount); },0);
  const actualMonthlyPace = paceMonthsElapsed > 0 ? recentContributed/paceMonthsElapsed : plannedMonthly;
  const paceWindowLabel = effectivePaceStart > startDate ? ('last ' + paceWindowMonths + 'mo') : 'since ' + startDate.toLocaleDateString(undefined,{month:'short',year:'numeric'});

  function project(monthlyAmt, months){
    const r = targetCagr/12; let v = currentValue; const series=[v]; let hitMonth = null;
    for(let i=1;i<=months;i++){
      v = v*(1+r)+monthlyAmt; series.push(v);
      if(hitMonth===null && v>=goalAmount) hitMonth = i;
    }
    return {series:series, hitMonth:hitMonth};
  }
  function etaLabel(hitMonth){
    if(hitMonth===null || hitMonth===undefined) return 'beyond 20yr window';
    const d = new Date(); d.setMonth(d.getMonth()+hitMonth);
    return d.toLocaleDateString(undefined, {month:'short', year:'numeric'});
  }
  const goldProj = project(plannedMonthly, 240);
  const blueProj = project(actualMonthlyPace, 240);
  const monthsMax = Math.max(goldProj.hitMonth||240, blueProj.hitMonth||240);

  const inceptionDate = CONFIG.portfolio_inception ? new Date(CONFIG.portfolio_inception) : startDate;
  const monthsFromInceptionToToday = Math.max(0, (today-inceptionDate)/(1000*60*60*24*30));
  const totalSpanMonths = monthsFromInceptionToToday + monthsMax;
  const W=560,H=158,pad=8,padBottom=22;
  const maxV = goalAmount*1.05;
  const toX = function(monthsFromInception){ return pad + (monthsFromInception/totalSpanMonths)*(W-2*pad); };
  const toY = function(v){ return H-padBottom - (Math.min(v,maxV)/maxV)*(H-pad-padBottom); };

  const deployedBuys = TRANSACTIONS.filter(function(t){ return t.action==='BUY' && new Date(t.date) >= inceptionDate && new Date(t.date) <= today && t.base_currency_amount; })
    .sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  let deployedCum = 0;
  const deployedPoints = deployedBuys.map(function(t){ deployedCum += Number(t.base_currency_amount); return {m: (new Date(t.date)-inceptionDate)/(1000*60*60*24*30), v: deployedCum}; });
  const deployedPath = deployedPoints.length ? ('M'+toX(0)+' '+toY(0)+' '+deployedPoints.map(function(p){ return 'L'+toX(p.m)+' '+toY(p.v); }).join(' ')+' L'+toX(monthsFromInceptionToToday)+' '+toY(deployedCum)) : '';

  const goldPath = goldProj.series.slice(0, (goldProj.hitMonth||monthsMax)+1).map(function(v,i){ return (i===0?'M':'L')+toX(monthsFromInceptionToToday+i)+' '+toY(v); }).join(' ');
  const bluePath = blueProj.series.slice(0, (blueProj.hitMonth||monthsMax)+1).map(function(v,i){ return (i===0?'M':'L')+toX(monthsFromInceptionToToday+i)+' '+toY(v); }).join(' ');
  const yearTicks = [];
  const tickStepYears = totalSpanMonths <= 120 ? 1 : 2;
  for(let yr=inceptionDate.getFullYear(); yr<=today.getFullYear()+Math.ceil(monthsMax/12); yr+=tickStepYears){
    const m = (new Date(yr,0,1)-inceptionDate)/(1000*60*60*24*30);
    if(m>=0 && m<=totalSpanMonths) yearTicks.push({m:m, year:yr});
  }
  document.getElementById('trajectory-section').innerHTML =
    '<div class="chart-card"><div class="chart-title">TRAJECTORY TO GOAL</div>' +
    '<div class="chart-sub">From portfolio inception (' + inceptionDate.toLocaleDateString(undefined,{month:'short',year:'numeric'}) + ') - capital deployed through today, compounding curves beyond it</div>' +
    '<svg id="traj-svg" width="100%" height="158" viewBox="0 0 560 158" preserveAspectRatio="none">' +
    '<line x1="' + pad + '" y1="' + toY(goalAmount) + '" x2="' + (W-pad) + '" y2="' + toY(goalAmount) + '" stroke="#232129" stroke-width="1" stroke-dasharray="3 3"/>' +
    yearTicks.map(function(t){ return '<line x1="' + toX(t.m) + '" y1="' + pad + '" x2="' + toX(t.m) + '" y2="' + (H-padBottom) + '" stroke="#1B1A20" stroke-width="1"/>'; }).join('') +
    '<path d="' + deployedPath + '" fill="none" stroke="#5B6774" stroke-width="2"/>' +
    '<path d="' + goldPath + '" fill="none" stroke="#C9A227" stroke-width="2" stroke-dasharray="5 3"/>' +
    '<path d="' + bluePath + '" fill="none" stroke="#4F8FE8" stroke-width="2" stroke-dasharray="5 3"/>' +
    '<line x1="' + toX(monthsFromInceptionToToday) + '" y1="' + pad + '" x2="' + toX(monthsFromInceptionToToday) + '" y2="' + (H-padBottom) + '" stroke="#7A7886" stroke-width="1" stroke-dasharray="1 2"/>' +
    '<circle cx="' + toX(monthsFromInceptionToToday) + '" cy="' + toY(currentValue) + '" r="3.5" fill="#F2EFE9"/>' +
    '<text x="' + (toX(monthsFromInceptionToToday)+6) + '" y="' + (toY(currentValue)-6) + '" fill="#A6A3AE" font-size="9" font-family="IBM Plex Mono">today</text>' +
    '<text x="' + (W-pad-24) + '" y="' + (toY(goalAmount)-6) + '" fill="#7A7886" font-size="9" font-family="IBM Plex Mono">' + fmtUsd(goalAmount) + '</text>' +
    '<line x1="' + pad + '" y1="' + (H-padBottom) + '" x2="' + (W-pad) + '" y2="' + (H-padBottom) + '" stroke="#232129" stroke-width="1"/>' +
    yearTicks.map(function(t){ return '<line x1="' + toX(t.m) + '" y1="' + (H-padBottom) + '" x2="' + toX(t.m) + '" y2="' + (H-padBottom+5) + '" stroke="#A6A3AE" stroke-width="1.2"/>' +
      '<text x="' + toX(t.m) + '" y="' + (H-padBottom+16) + '" fill="#D7D4CC" font-size="10" font-family="IBM Plex Mono" text-anchor="middle">' + t.year + '</text>'; }).join('') +
    '</svg><div class="chart-legend">' +
    '<span><span class="chart-sw" style="background:#5B6774"></span>Capital deployed to date (cost basis, not market value - real history needs snapshot backfill)</span>' +
    '<span><span class="chart-sw" style="background:repeating-linear-gradient(90deg,#C9A227 0 3px,transparent 3px 5px)"></span>Planned pace (' + fmtUsd(plannedMonthly) + '/mo) - ETA ' + etaLabel(goldProj.hitMonth) + '</span>' +
    '<span><span class="chart-sw" style="background:repeating-linear-gradient(90deg,#4F8FE8 0 3px,transparent 3px 5px)"></span>Actual pace (' + paceWindowLabel + ', ' + fmtUsd(Math.round(actualMonthlyPace)) + '/mo) - ETA ' + etaLabel(blueProj.hitMonth) + '</span>' +
    '</div><p class="hint" style="margin-top:6px;">Both projected lines use the target CAGR (' + (targetCagr*100).toFixed(0) + '%) as the return rate - a real trailing return (XIRR) isn\'t computed yet.</p></div>';
  attachChartCrosshair('traj-svg', {
    W:W, H:H, pad:pad, padBottom:padBottom,
    resolve: function(svgX){
      const mFromInception = ((svgX-pad)/(W-2*pad))*totalSpanMonths;
      if(mFromInception < 0 || mFromInception > totalSpanMonths) return null;
      const dateAtM = new Date(inceptionDate); dateAtM.setDate(dateAtM.getDate() + Math.round(mFromInception*30));
      const dateLabel = dateAtM.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
      if(mFromInception <= monthsFromInceptionToToday){
        let cum = 0;
        deployedPoints.forEach(function(p){ if(p.m<=mFromInception) cum = p.v; });
        return {x:toX(mFromInception), y:toY(cum), dateLabel:dateLabel, lines:[{color:'#5B6774',label:'Deployed',val:fmtUsd(cum)}]};
      }
      const monthsFromToday = Math.round(mFromInception - monthsFromInceptionToToday);
      const goldDone = goldProj.hitMonth!==null && monthsFromToday > goldProj.hitMonth;
      const blueDone = blueProj.hitMonth!==null && monthsFromToday > blueProj.hitMonth;
      const gv = goldProj.series[Math.min(monthsFromToday, goldProj.hitMonth!==null?goldProj.hitMonth:goldProj.series.length-1)];
      const bv = blueProj.series[Math.min(monthsFromToday, blueProj.hitMonth!==null?blueProj.hitMonth:blueProj.series.length-1)];
      return {x:toX(mFromInception), y:toY(blueDone?goalAmount:bv), dateLabel:dateLabel, lines:[
        {color:'#C9A227',label:'Planned',val:goldDone?'Goal reached':fmtUsd(Math.round(gv))},
        {color:'#4F8FE8',label:'Actual pace',val:blueDone?'Goal reached':fmtUsd(Math.round(bv))}
      ]};
    }
  });
}

function renderContributionChart(target){
  if(!TARGETS.length || !TRANSACTIONS.length){ document.getElementById('contribution-section').innerHTML=''; return; }
  const sortedTargets = TARGETS.slice().sort(function(a,b){ return new Date(a.effective_date)-new Date(b.effective_date); });
  const startDate = new Date(sortedTargets[0].effective_date);
  const today = new Date();
  function plannedMonthlyAt(date){
    let applicable = sortedTargets[0];
    sortedTargets.forEach(function(t){ if(new Date(t.effective_date)<=date) applicable=t; });
    return Number(applicable.monthly_contribution_usd);
  }
  const buys = TRANSACTIONS.filter(function(t){ return t.action==='BUY' && new Date(t.date) >= startDate && t.base_currency_amount; })
    .sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  const monthsElapsed = Math.max(1, Math.round((today-startDate)/(1000*60*60*24*30)));
  let cum = 0;
  const actualPoints = buys.map(function(b){ cum += Number(b.base_currency_amount); return {date:new Date(b.date), value:cum}; });
  const actualTotal = cum;
  let plannedCum = 0; const plannedPoints = [];
  for(let cursor=new Date(startDate); cursor<=today; cursor.setMonth(cursor.getMonth()+1)){
    plannedCum += plannedMonthlyAt(cursor);
    plannedPoints.push({date:new Date(cursor), value:plannedCum});
  }
  const plannedTotal = plannedCum;
  const planLabel = sortedTargets.map(function(t){ return fmtUsd(Number(t.monthly_contribution_usd))+'/mo from '+new Date(t.effective_date).getFullYear(); }).join(' -> ');
  const W=560,H=130,pad=8,padBottom=20;
  const maxV = Math.max(actualTotal, plannedTotal) * 1.1 || 1;
  const toX = function(d){ return pad + ((d-startDate)/(today-startDate))*(W-2*pad); };
  const toY = function(v){ return H-padBottom - (v/maxV)*(H-pad-padBottom); };
  const actualPath = actualPoints.length ? ('M'+toX(startDate)+' '+toY(0)+' '+actualPoints.map(function(p){ return 'L'+toX(p.date)+' '+toY(p.value); }).join(' ')) : '';
  const plannedPath = plannedPoints.length ? ('M'+toX(startDate)+' '+toY(0)+' '+plannedPoints.map(function(p){ return 'L'+toX(p.date)+' '+toY(p.value); }).join(' ')) : '';
  const tickStepMonths = monthsElapsed<=8 ? 1 : monthsElapsed<=20 ? 3 : monthsElapsed<=48 ? 6 : 12;
  const dateTicks = [];
  for(let m=0; ; m+=tickStepMonths){
    const d = new Date(startDate); d.setMonth(d.getMonth()+m);
    if(d>today) break;
    dateTicks.push(d);
  }
  const tickFmt = tickStepMonths>=12 ? {year:'numeric'} : {month:'short',year:'2-digit'};
  if(!dateTicks.length || dateTicks[dateTicks.length-1].toLocaleDateString(undefined,tickFmt) !== today.toLocaleDateString(undefined,tickFmt)){
    dateTicks.push(today);
  }
  document.getElementById('contribution-section').innerHTML =
    '<div class="chart-card"><div class="chart-title">CONTRIBUTION PACE</div>' +
    '<div class="chart-sub">Cumulative real purchases vs. planned (' + planLabel + ') since ' + startDate.toLocaleDateString() + '</div>' +
    '<svg id="contrib-svg" width="100%" height="130" viewBox="0 0 560 130" preserveAspectRatio="none">' +
    dateTicks.map(function(d){ return '<line x1="' + toX(d) + '" y1="' + pad + '" x2="' + toX(d) + '" y2="' + (H-padBottom) + '" stroke="#1B1A20" stroke-width="1"/>'; }).join('') +
    '<path d="' + plannedPath + '" fill="none" stroke="#7A7886" stroke-width="1.5" stroke-dasharray="4 3"/>' +
    '<path d="' + actualPath + '" fill="none" stroke="#35C48C" stroke-width="2"/>' +
    '<line x1="' + pad + '" y1="' + (H-padBottom) + '" x2="' + (W-pad) + '" y2="' + (H-padBottom) + '" stroke="#232129" stroke-width="1"/>' +
    dateTicks.map(function(d){ return '<line x1="' + toX(d) + '" y1="' + (H-padBottom) + '" x2="' + toX(d) + '" y2="' + (H-padBottom+5) + '" stroke="#A6A3AE" stroke-width="1.2"/>' +
      '<text x="' + toX(d) + '" y="' + (H-padBottom+14) + '" fill="#D7D4CC" font-size="10" font-family="IBM Plex Mono" text-anchor="middle">' + d.toLocaleDateString(undefined,tickFmt) + '</text>'; }).join('') +
    '</svg><div class="chart-legend">' +
    '<span><span class="chart-sw" style="background:#35C48C"></span>Actual: ' + fmtUsd(actualTotal) + '</span>' +
    '<span>Planned: ' + fmtUsd(plannedTotal) + '</span></div></div>';
  attachChartCrosshair('contrib-svg', {
    W:W, H:H, pad:pad, padBottom:padBottom,
    resolve: function(svgX){
      const frac = (svgX-pad)/(W-2*pad);
      if(frac < 0 || frac > 1) return null;
      const dateAtX = new Date(startDate.getTime() + frac*(today-startDate));
      let actualAt = 0;
      actualPoints.forEach(function(p){ if(p.date<=dateAtX) actualAt = p.value; });
      let plannedAt = 0;
      plannedPoints.forEach(function(p){ if(p.date<=dateAtX) plannedAt = p.value; });
      return {x:svgX, y:toY(actualAt), dateLabel:dateAtX.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}), lines:[
        {color:'#35C48C',label:'Actual',val:fmtUsd(actualAt)},
        {color:'#7A7886',label:'Planned',val:fmtUsd(plannedAt)}
      ]};
    }
  });
}

function polarToCartesian(cx,cy,r,angleDeg){ const a=(angleDeg-90)*Math.PI/180; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }
function attachChartCrosshair(svgId, cfg){
  const svg = document.getElementById(svgId);
  if(!svg) return;
  const ns = 'http://www.w3.org/2000/svg';
  let cl = svg.querySelector('.ch-line'), cd = svg.querySelector('.ch-dot');
  if(!cl){ cl = document.createElementNS(ns,'line'); cl.setAttribute('class','ch-line'); cl.setAttribute('stroke','#7A7886'); cl.setAttribute('stroke-width','1'); cl.setAttribute('opacity','0'); svg.appendChild(cl); }
  if(!cd){ cd = document.createElementNS(ns,'circle'); cd.setAttribute('class','ch-dot'); cd.setAttribute('r','3.5'); cd.setAttribute('fill','#F2EFE9'); cd.setAttribute('opacity','0'); svg.appendChild(cd); }
  function move(clientX, clientY){
    const rect = svg.getBoundingClientRect();
    const svgX = ((clientX-rect.left)/rect.width) * cfg.W;
    const info = cfg.resolve(svgX);
    if(!info){ cl.setAttribute('opacity','0'); cd.setAttribute('opacity','0'); hideChartTooltip(); return; }
    cl.setAttribute('x1',info.x); cl.setAttribute('x2',info.x); cl.setAttribute('y1',cfg.pad); cl.setAttribute('y2',cfg.H-cfg.padBottom); cl.setAttribute('opacity','1');
    cd.setAttribute('cx',info.x); cd.setAttribute('cy',info.y); cd.setAttribute('opacity','1');
    showChartTooltip(clientX, clientY, info.dateLabel, info.lines);
  }
  svg.onmousemove = function(e){ move(e.clientX, e.clientY); };
  svg.onmouseleave = function(){ cl.setAttribute('opacity','0'); cd.setAttribute('opacity','0'); hideChartTooltip(); };
  svg.ontouchmove = function(e){ if(e.touches && e.touches[0]){ e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); } };
  svg.ontouchend = function(){ cl.setAttribute('opacity','0'); cd.setAttribute('opacity','0'); hideChartTooltip(); };
}
function getChartTooltipEl(){
  let el = document.getElementById('chart-tooltip');
  if(!el){ el = document.createElement('div'); el.id='chart-tooltip'; el.className='chart-tooltip'; document.body.appendChild(el); }
  return el;
}
function showChartTooltip(clientX, clientY, dateLabel, lines){
  const el = getChartTooltipEl();
  el.innerHTML = '<div class="ct-date">' + dateLabel + '</div>' + lines.map(function(l){
    return '<div class="ct-row"><span class="ct-sw" style="background:' + l.color + '"></span>' + l.label + ': <b>' + maskable(l.val) + '</b></div>';
  }).join('');
  el.style.left = (clientX+14) + 'px';
  el.style.top = (clientY-10+window.scrollY) + 'px';
  el.style.opacity = '1';
}
function hideChartTooltip(){
  const el = document.getElementById('chart-tooltip');
  if(el) el.style.opacity = '0';
}
function arcPath(cx,cy,rOuter,rInner,startAngle,endAngle){
  const p1=polarToCartesian(cx,cy,rOuter,endAngle), p2=polarToCartesian(cx,cy,rOuter,startAngle);
  const p3=polarToCartesian(cx,cy,rInner,startAngle), p4=polarToCartesian(cx,cy,rInner,endAngle);
  const large=endAngle-startAngle>180?1:0;
  return 'M ' + p1.x + ' ' + p1.y + ' A ' + rOuter + ' ' + rOuter + ' 0 ' + large + ' 0 ' + p2.x + ' ' + p2.y + ' L ' + p3.x + ' ' + p3.y + ' A ' + rInner + ' ' + rInner + ' 0 ' + large + ' 1 ' + p4.x + ' ' + p4.y + ' Z';
}
function resolveColor(v){ const el=document.createElement('div'); el.style.color=v; document.body.appendChild(el); const c=getComputedStyle(el).color; document.body.removeChild(el); return c; }
const DIM_COLORS = {
  region: {US:'var(--blue)',UAE:'var(--green)',India:'var(--orange)',Crypto:'var(--purple)',Other:'var(--gray)'},
  currency: {USD:'var(--blue)',AED:'var(--teal)',INR:'var(--rose)'},
  classification: {Core:'var(--green)',Tactical:'var(--blue)',Hedge:'var(--red)'},
  cap: {Large:'var(--blue)',Mid:'var(--teal)',Small:'var(--orange)',NA:'var(--gray)'},
  broker: {}
};
function dimValue(h, dim){
  if(dim==='region') return h.region;
  if(dim==='currency') return h.currency;

function attachLots(lots){ HOLDINGS.forEach(function(h){ h.lots = lots.filter(function(l){ return l.account_id===h.account_id && l.asset_id===h.asset_id; }); }); }
function sleep(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }
function freshFetch(url){ return fetch(url + (url.indexOf('?')>=0 ? '&' : '?') + '_ts=' + Date.now(), { cache: 'no-store' }); }
let ACCESS_KEY = localStorage.getItem('portfolio_access_key') || '';
let ACCESS_LEVEL = null;
async function loadData(action, extraParams){
  let url = WEB_APP_URL + '?action=' + action + '&key=' + encodeURIComponent(ACCESS_KEY);
  if (extraParams) Object.keys(extraParams).forEach(function(k){ url += '&' + k + '=' + encodeURIComponent(extraParams[k]); });
  let lastErr;
  for(let attempt=1; attempt<=2; attempt++){
    try{
      const res = await freshFetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status + ' on action=' + action);
      const json = await res.json();
      if(json.error) throw new Error(json.error);
      if(json.accessLevel){
        ACCESS_LEVEL = json.accessLevel;
        document.body.classList.toggle('is-family', ACCESS_LEVEL==='family');
      }
      return json;
    } catch(err){
      lastErr = err;
      if(attempt===1) await sleep(2000);
    }
  }
  throw lastErr;
}
function parseCardKey(cardKey){ const parts = cardKey.split('__'); return { account_id: parts[0], asset_id: parts[1] }; }
async function submitManualPrice(cardKey, inputId){
  const input = document.getElementById(inputId);
  const price = Number(input.value);
  if(!input.value || isNaN(price)){ input.focus(); return; }
  const { asset_id } = parseCardKey(cardKey);
  input.disabled = true;
  try{
    await loadData('set_manual_price', { asset_id: asset_id, price: price });
    await fullLoad(false);
  } catch(err){
    alert('Could not save manual price: ' + err.message);
    input.disabled = false;
  }
}
async function submitResumeAutoFetch(cardKey){
  const { asset_id } = parseCardKey(cardKey);
  try{
    await loadData('resume_auto_fetch', { asset_id: asset_id });
    await fullLoad(false);
  } catch(err){
    alert('Could not resume auto-fetch: ' + err.message);
  }
}
let loadInProgress = false;
async function fullLoad(triggerRefresh){
  if(loadInProgress) return;
  loadInProgress = true;
  const holdingsAction = triggerRefresh ? 'refresh' : 'holdings';
  const asofEl = document.getElementById('asof-line');
  const btn = document.getElementById('refresh-btn');
  if(btn){ btn.disabled = true; btn.textContent = triggerRefresh ? 'Fetching...' : 'Loading...'; }
  if(triggerRefresh) asofEl.textContent = 'Fetching live prices - can take up to a minute...';
  try{
    const hJson = await loadData(holdingsAction);
    HOLDINGS = hJson.holdingsSummary || [];
    attachLots(hJson.holdingsLots || []);
    const results = await Promise.all([loadData('accounts'), loadData('targets'), loadData('transactions'), loadData('config'), loadData('returns').catch(function(){ return null; }), loadData('get_watchlist').catch(function(){ return null; })]);
    ACCOUNTS = results[0].accounts || []; TARGETS = results[1].targets || []; TRANSACTIONS = results[2].transactions || [];
    CONFIG = results[3].config || {};
    RETURNS = (results[4] && !results[4].error) ? results[4] : null;
    WATCHLIST = (results[5] && results[5].watchlist) ? results[5].watchlist : [];
    checkWatchlistAlerts(WATCHLIST);
    if(ACTIVE_TAB==='watchlist') renderWatchlistView();
    asofEl.textContent = 'Live as of ' + new Date(hJson.asOfDate).toLocaleString() +
      (hJson.warnings && hJson.warnings.length ? ' - ' + hJson.warnings.length + ' warning(s)' : '') +
      (hJson.refreshedPrices ? ' - prices just refreshed' : '');
    buildAppShell(); renderAll();
  } catch(err){
    document.getElementById('app').innerHTML = '<div class="error-box"><b>Could not load live data</b><br><br>' + err.message + '<br><br><button class="refresh-btn" onclick="fullLoad(false)">Retry</button></div>';
    console.error(err);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Refresh prices'; }
    loadInProgress = false;
  }
}
setInterval(function(){ if(ACCESS_LEVEL) fullLoad(false); }, 5*60*1000);

// ---- Access key gate ----
// "Block everything until unlocked" - the lock screen is the ONLY thing
// visible until a valid key is confirmed; #main-wrap starts at display:none
// in the HTML itself, never revealed until submitAccessKey/initGate succeeds.
function showLockedUI(locked){
  document.getElementById('lock-screen').classList.toggle('show', locked);
  document.getElementById('main-wrap').style.display = locked ? 'none' : 'block';
  document.getElementById('tab-switcher').style.display = locked ? 'none' : 'flex';
}
async function initGate(){
  if(ACCESS_KEY){
    try{
      await loadData('config'); // lightweight call just to validate the stored key
      showLockedUI(false);
      fullLoad(false);
      return;
    } catch(err){
      localStorage.removeItem('portfolio_access_key');
      ACCESS_KEY = '';
    }
  }
  showLockedUI(true);
  document.getElementById('lock-key-input').focus();
}
async function submitAccessKey(){
  const input = document.getElementById('lock-key-input');
  const errEl = document.getElementById('lock-error');
  const key = input.value.trim();
  if(!key) return;
  ACCESS_KEY = key;
  try{
    await loadData('config');
    localStorage.setItem('portfolio_access_key', key);
    errEl.textContent = '';
    showLockedUI(false);
    fullLoad(false);
  } catch(err){
    ACCESS_KEY = '';
    errEl.textContent = 'Incorrect key - try again.';
  }
}
initGate();

function renderWatchlistView(){
  const el = document.getElementById('watchlist-view');
  if(!WATCHLIST.length){
    el.innerHTML = '<p class="hint" style="margin-top:20px;">Nothing on your watchlist yet. Use the + button to add a ticker.</p>';
    return;
  }
  const active = WATCHLIST.filter(w=>w.status==='ACTIVE');
  const triggered = WATCHLIST.filter(w=>w.status==='TRIGGERED');
  function row(w){
    const dirLabel = w.direction==='BUY_BELOW' ? 'Buy below' : 'Sell above';
    const curStr = w.current_price!==null ? fmtMoney(w.current_price, w.price_currency) : 'No price yet';
    const distStr = w.status==='TRIGGERED' ? 'Target hit'
      : (w.distance_pct!==null ? Math.abs(w.distance_pct).toFixed(1) + '% away' : '-');
    const distClass = w.status==='TRIGGERED' || (w.distance_pct!==null && Math.abs(w.distance_pct)<=2) ? 'close' : 'far';
    return '<div class="wl-row"><div class="wl-left"><div class="wl-ticker">' + w.asset_id + '</div>' +
      '<div class="wl-meta">' + dirLabel + ' ' + fmtMoney(w.target_price, w.target_currency) + (w.notes?(' &middot; ' + w.notes):'') + '</div>' +
      '<span class="wl-badge ' + w.status.toLowerCase() + '">' + w.status + '</span></div>' +
      '<div class="wl-right"><div class="wl-current">' + maskable(curStr) + '</div>' +
      '<div class="wl-distance ' + distClass + '">' + distStr + '</div>' +
      '<button class="wl-dismiss" onclick="dismissWatchlistItem(\'' + w.watchlist_id + '\')">Dismiss</button></div></div>';
  }
  let html = '<p class="section-title" style="margin-top:18px;">WATCHLIST</p>';
  if(triggered.length){
    html += triggered.map(row).join('');
  }
  html += active.map(row).join('');
  el.innerHTML = html;
}
async function dismissWatchlistItem(id){

}

function recomputeTxnGrossAmount(){
  if(TXN_STATE.action==='BUY' || TXN_STATE.action==='SELL'){
    const q = Number(TXN_STATE.quantity)||0, p = Number(TXN_STATE.price)||0;
    TXN_STATE.gross_amount = (q*p) ? (q*p).toFixed(2) : '';
  }
}
async function refreshTxnPreview(){
  const account = ACCOUNTS.find(function(a){ return a.account_id===TXN_STATE.account_id; });
  if(!account || !TXN_STATE.gross_amount){ TXN_STATE.preview=null; return; }
  const tradeCcy = account.currency;
  const baseCcy = (CONFIG && CONFIG.base_currency) || 'USD';
  if(tradeCcy===baseCcy){ TXN_STATE.preview = { base: Number(TXN_STATE.gross_amount), sameCcy:true }; return; }
  try{
    const r = await loadData('get_fx_rate_for_form', {from_currency:tradeCcy, to_currency:baseCcy, date:TXN_STATE.date});
    TXN_STATE.preview = r.rate ? { base: Number(TXN_STATE.gross_amount)/r.rate, isFallback:r.isFallback, sameCcy:false } : null;
  } catch(e){ TXN_STATE.preview = null; }
}
async function checkTxnSellWarning(){
  TXN_STATE.sellWarning = null;
  if(TXN_STATE.action!=='SELL' || !TXN_STATE.account_id || !TXN_STATE.asset_id || !TXN_STATE.quantity) { return; }
  try{
    const r = await loadData('get_current_quantity', {account_id:TXN_STATE.account_id, asset_id:TXN_STATE.asset_id});
    if(Number(TXN_STATE.quantity) > Number(r.quantity) + 1e-6){
      TXN_STATE.sellWarning = 'Selling ' + TXN_STATE.quantity + ' but only ' + r.quantity + ' on record in ' + TXN_STATE.account_id + '. Fine for a short sale/options assignment - otherwise double-check.';
    }
  } catch(e){ /* non-fatal - server re-checks on submit regardless */ }
}
async function onTxnNumberChange(){

function updateTxnComputedArea(){
  const pv = document.getElementById('txn-preview-area'); if(pv) pv.innerHTML = txnPreviewHtml();
  const wn = document.getElementById('txn-warning-area'); if(wn) wn.innerHTML = txnWarningHtml();
  const btn = document.getElementById('txn-submit-btn'); if(btn) btn.disabled = !txnCanSubmit();

function txnCanSubmit(){
  if(!TXN_STATE.account_id) return false;
  if((TXN_STATE.action==='BUY'||TXN_STATE.action==='SELL'||TXN_STATE.action==='DIVIDEND') && !TXN_STATE.asset_id) return false;
  if((TXN_STATE.action==='BUY'||TXN_STATE.action==='SELL') && (!TXN_STATE.quantity || !TXN_STATE.price)) return false;
  if(!TXN_STATE.gross_amount) return false;
  if(TXN_STATE.sellWarning && !TXN_SELL_CONFIRMED) return false;
  return true;
}
async function submitTxn(){
  const btn = document.getElementById('txn-submit-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  const params = {
    action: TXN_STATE.action, account_id: TXN_STATE.account_id, asset_id: TXN_STATE.asset_id||'',
    date: TXN_STATE.date, quantity: TXN_STATE.quantity||'', price: TXN_STATE.price||'',
    gross_amount: TXN_STATE.gross_amount, notes: TXN_STATE.notes||'',
    confirmSellWarning: TXN_SELL_CONFIRMED ? 'true' : 'false',
  };
  if(TXN_STATE.newTicker){
    params.asset_name = TXN_STATE.asset_name || TXN_STATE.asset_id;
    params.asset_class = TXN_STATE.asset_class || 'Equity';
    params.exchange = TXN_STATE.exchange || '';
  }
  try{
    const r = await loadData('create_transaction', params);
    if(r.needsConfirmation){ TXN_STATE.sellWarning = r.warning; renderTxnModalBody(); return; }
    if(!r.success){ TXN_STATE.submitError = r.error||'Unknown error'; renderTxnModalBody(); return; }
    closeTxnModal();
    await fullLoad(false);
  } catch(err){
    TXN_STATE.submitError = err.message; renderTxnModalBody();
  }
}
function renderTxnModalBody(){
  const el = document.getElementById('txn-modal-body');
  if(!el) return;
  const showQtyPrice = TXN_STATE.action==='BUY' || TXN_STATE.action==='SELL';
  const showAmountOnly = TXN_STATE.action==='DEPOSIT' || TXN_STATE.action==='WITHDRAWAL' || TXN_STATE.action==='DIVIDEND';
  el.innerHTML =
    '<div class="txn-field"><label class="txn-label">ACTION</label>' +
    '<select class="txn-select" onchange="setTxnField(\'action\', this.value)">' +
    ['BUY','SELL','DIVIDEND','DEPOSIT','WITHDRAWAL'].map(function(a){ return '<option value="' + a + '"' + (TXN_STATE.action===a?' selected':'') + '>' + a + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="txn-field"><label class="txn-label">ACCOUNT</label>' +
    '<select class="txn-select" onchange="setTxnField(\'account_id\', this.value)">' + txnAccountOptions() + '</select></div>' +
    ((TXN_STATE.action!=='DEPOSIT' && TXN_STATE.action!=='WITHDRAWAL') ? ('<div class="txn-field"><label class="txn-label">TICKER</label>' + txnAssetSelectHtml() + '</div>') : '') +
    (TXN_STATE.newTicker ? (
      '<div class="txn-new-ticker-fields">' +
      '<div class="txn-field"><label class="txn-label">NAME</label><input class="txn-input" value="' + (TXN_STATE.asset_name||'') + '" oninput="TXN_STATE.asset_name=this.value"></div>' +
      '<div class="txn-field"><label class="txn-label">ASSET CLASS</label><input class="txn-input" value="' + (TXN_STATE.asset_class||'Equity') + '" oninput="TXN_STATE.asset_class=this.value"></div>' +
      '<div class="txn-field"><label class="txn-label">EXCHANGE</label><input class="txn-input" value="' + (TXN_STATE.exchange||'') + '" oninput="TXN_STATE.exchange=this.value"></div>' +
      '</div>'
    ) : '') +
    '<div class="txn-field"><label class="txn-label">DATE</label><input type="date" class="txn-input" value="' + TXN_STATE.date + '" onchange="setTxnField(\'date\', this.value)"></div>' +
    (showQtyPrice ? (
      '<div class="txn-field"><label class="txn-label">QUANTITY</label><input type="number" step="any" class="txn-input" value="' + TXN_STATE.quantity + '" oninput="TXN_STATE.quantity=this.value; onTxnNumberChange();"></div>' +
      '<div class="txn-field"><label class="txn-label">PRICE (per unit)</label><input type="number" step="any" class="txn-input" value="' + TXN_STATE.price + '" oninput="TXN_STATE.price=this.value; onTxnNumberChange();"></div>'
    ) : '') +
    (showAmountOnly ? (
      '<div class="txn-field"><label class="txn-label">AMOUNT</label><input type="number" step="any" class="txn-input" value="' + TXN_STATE.gross_amount + '" oninput="TXN_STATE.gross_amount=this.value; onTxnNumberChange();"></div>'
    ) : '') +
    '<div id="txn-preview-area">' + txnPreviewHtml() + '</div>' +
    '<div id="txn-warning-area">' + txnWarningHtml() + '</div>' +
    '<div class="txn-field"><label class="txn-label">NOTES (optional)</label><input class="txn-input" value="' + (TXN_STATE.notes||'') + '" oninput="TXN_STATE.notes=this.value"></div>' +
    (TXN_STATE.submitError ? ('<div class="txn-error">' + TXN_STATE.submitError + '</div>') : '') +
    '<button class="txn-submit-btn" id="txn-submit-btn" ' + (txnCanSubmit()?'':'disabled') + ' onclick="submitTxn()">Save transaction</button>';
}
</script>
</body>
</html>
